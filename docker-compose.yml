services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: football-ai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "StrongPass!123"
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &
      pid=$$!;
      echo 'Waiting for SQL Server to accept connections...';
      until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" > /dev/null 2>&1; do
        sleep 2;
      done;
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"IF DB_ID('Football_AI') IS NULL CREATE DATABASE [Football_AI];\";
      wait $$pid
      "
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"IF DB_ID('Football_AI') IS NOT NULL SELECT 1\" > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football-ai-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      APP_DATASOURCE_HOST: "sqlserver"
      APP_UPLOAD_DIR: "/app/uploads"
    ports:
      - "8080:8080"
    volumes:
      - app-uploads:/app/uploads
    restart: unless-stopped

volumes:
  sqlserver-data:
  app-uploads:
