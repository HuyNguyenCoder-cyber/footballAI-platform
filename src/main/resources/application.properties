spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${APP_DATASOURCE_HOST:localhost}:${APP_DATASOURCE_PORT:1433};databaseName=${APP_DATASOURCE_DB:Football_AI};encrypt=false;trustServerCertificate=true;
spring.datasource.username=${APP_DATASOURCE_USERNAME:sa}
spring.datasource.password=${APP_DATASOURCE_PASSWORD:StrongPass!123}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.security.default-admin.username=admin
app.security.default-admin.password=admin123
