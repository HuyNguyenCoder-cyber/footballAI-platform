spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Local development fallbacks.
# In Docker/production, these values are overridden by environment variables.
spring.datasource.url=jdbc:sqlserver://${APP_DATASOURCE_HOST:localhost}:${APP_DATASOURCE_PORT:1433};databaseName=${APP_DATASOURCE_DB:Football_AI};encrypt=${APP_DATASOURCE_ENCRYPT:false};trustServerCertificate=${APP_DATASOURCE_TRUST_SERVER_CERTIFICATE:true};
spring.datasource.username=${APP_DATASOURCE_USERNAME:sa}
spring.datasource.password=${APP_DATASOURCE_PASSWORD}
spring.cache.type=redis
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${APP_REDIS_HOST:localhost}
spring.data.redis.port=${APP_REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.site.base-url=${APP_SITE_BASE_URL:http://localhost:8080}
app.site.default-image-path=${APP_SITE_DEFAULT_IMAGE_PATH:/assets/images/og-default.svg}
app.security.default-admin.username=${APP_SECURITY_DEFAULT_ADMIN_USERNAME:}
app.security.default-admin.password=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:}
