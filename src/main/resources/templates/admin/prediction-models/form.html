<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${predictionModel.id == null ? 'Create Prediction Model' : 'Update Prediction Model'}">Prediction Model Form</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${predictionModel.id == null ? 'Create Prediction Model' : 'Update Prediction Model'}"></h1>
                        <p class="text-muted mb-0">Manage prediction model probabilities.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

                    <form th:action="${predictionModel.id == null} ? @{/admin/prediction-models/create} : @{/admin/prediction-models/{id}/update(id=${predictionModel.id})}"
                          th:object="${predictionModel}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${predictionModel.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB + ' | ' + #temporals.format(match.matchTime, 'dd MMM yyyy HH:mm')}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${predictionModel.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${predictionModel.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="teamAWinProbability">Team A Win %</label>
                                <input id="teamAWinProbability" type="number" min="0" max="100" class="form-control"
                                       th:field="*{teamAWinProbability}"
                                       th:classappend="${#fields.hasErrors('teamAWinProbability')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAWinProbability')}" th:errors="*{teamAWinProbability}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="drawProbability">Draw %</label>
                                <input id="drawProbability" type="number" min="0" max="100" class="form-control"
                                       th:field="*{drawProbability}"
                                       th:classappend="${#fields.hasErrors('drawProbability')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('drawProbability')}" th:errors="*{drawProbability}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="teamBWinProbability">Team B Win %</label>
                                <input id="teamBWinProbability" type="number" min="0" max="100" class="form-control"
                                       th:field="*{teamBWinProbability}"
                                       th:classappend="${#fields.hasErrors('teamBWinProbability')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBWinProbability')}" th:errors="*{teamBWinProbability}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="dataConfidence">Data Confidence %</label>
                            <input id="dataConfidence" type="number" min="0" max="100" class="form-control"
                                   th:field="*{dataConfidence}"
                                   th:classappend="${#fields.hasErrors('dataConfidence')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dataConfidence')}" th:errors="*{dataConfidence}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${predictionModel.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/prediction-models}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
