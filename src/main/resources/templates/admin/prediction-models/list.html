<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Models</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Prediction Models</h1>
            <p class="text-muted mb-0">Manage win/draw probabilities for each match.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/prediction-models/new}">New Prediction Model</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Match</th>
                        <th>Status</th>
                        <th>Team A Win</th>
                        <th>Draw</th>
                        <th>Team B Win</th>
                        <th>Data Confidence</th>
                        <th style="width: 220px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${predictionModels}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.matchLabel}"></td>
                        <td th:text="${item.matchStatus}"></td>
                        <td th:text="${item.teamAWinProbability + '%'}"></td>
                        <td th:text="${item.drawProbability + '%'}"></td>
                        <td th:text="${item.teamBWinProbability + '%'}"></td>
                        <td th:text="${item.dataConfidence + '%'}"></td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary me-2" th:href="@{/admin/prediction-models/{id}/edit(id=${item.id})}">Edit</a>
                            <form th:action="@{/admin/prediction-models/{id}/delete(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this prediction model?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(predictionModels)}">
                        <td colspan="8" class="text-center text-muted py-4">No prediction models found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
