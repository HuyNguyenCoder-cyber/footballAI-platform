<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id == null ? 'Create Admin User' : 'Update Admin User'}">Admin User Form</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('users')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${user.id == null ? 'Create Admin User' : 'Update Admin User'}"></h1>
                        <p class="text-muted mb-0">Manage administrator account access.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${user.id == null} ? @{/admin/users/create} : @{/admin/users/{id}/update(id=${user.id})}"
                          th:object="${user}"
                          method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input id="username" type="text" class="form-control"
                                   th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" type="password" class="form-control"
                                   th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   th:placeholder="${user.id == null ? 'Enter password' : 'Leave blank to keep current password'}">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="role">Role</label>
                            <select id="role" class="form-select"
                                    th:field="*{role}"
                                    th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                                <option value="">-- Select role --</option>
                                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="enabled">Enabled</label>
                            <select id="enabled" class="form-select"
                                    th:field="*{enabled}"
                                    th:classappend="${#fields.hasErrors('enabled')} ? 'is-invalid' : ''">
                                <option th:value="true">Enabled</option>
                                <option th:value="false">Disabled</option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('enabled')}" th:errors="*{enabled}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${user.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
