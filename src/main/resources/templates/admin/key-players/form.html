<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${keyPlayer.id == null ? 'Create Key Player' : 'Update Key Player'}">Key Player Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${keyPlayer.id == null ? 'Create Key Player' : 'Update Key Player'}"></h1>
                        <p class="text-muted mb-0">Manage featured player information for match analysis.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${keyPlayer.id == null} ? @{/admin/key-players/create} : @{/admin/key-players/{id}/update(id=${keyPlayer.id})}"
                          th:object="${keyPlayer}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${keyPlayer.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB + ' | ' + #temporals.format(match.matchTime, 'dd MMM yyyy HH:mm')}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${keyPlayer.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${keyPlayer.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="playerName">Player Name</label>
                            <input id="playerName" type="text" class="form-control" th:field="*{playerName}" th:classappend="${#fields.hasErrors('playerName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('playerName')}" th:errors="*{playerName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="teamName">Team Name</label>
                            <input id="teamName" type="text" class="form-control" th:field="*{teamName}" th:classappend="${#fields.hasErrors('teamName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamName')}" th:errors="*{teamName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="shortDescription">Short Description</label>
                            <input id="shortDescription" type="text" class="form-control" th:field="*{shortDescription}" th:classappend="${#fields.hasErrors('shortDescription')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('shortDescription')}" th:errors="*{shortDescription}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="imageUrl">Image URL</label>
                            <input id="imageUrl" type="text" class="form-control" th:field="*{imageUrl}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="displayOrder">Display Order</label>
                            <input id="displayOrder" type="number" min="1" class="form-control" th:field="*{displayOrder}" th:classappend="${#fields.hasErrors('displayOrder')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${keyPlayer.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/key-players}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
