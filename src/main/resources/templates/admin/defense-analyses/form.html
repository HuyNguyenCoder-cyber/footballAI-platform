<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${defenseAnalysis.id == null ? 'Create Defense Analysis' : 'Update Defense Analysis'}">Defense Analysis Form</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${defenseAnalysis.id == null ? 'Create Defense Analysis' : 'Update Defense Analysis'}"></h1>
                        <p class="text-muted mb-0">Manage defensive strength data for both teams.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${defenseAnalysis.id == null} ? @{/admin/defense-analyses/create} : @{/admin/defense-analyses/{id}/update(id=${defenseAnalysis.id})}"
                          th:object="${defenseAnalysis}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${defenseAnalysis.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${defenseAnalysis.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${defenseAnalysis.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="row">
                            <div class="col-12"><h2 class="h6 fw-bold mb-3">Team A</h2></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAGoalsConceded">Goals Conceded</label><input id="teamAGoalsConceded" type="number" min="0" class="form-control" th:field="*{teamAGoalsConceded}" th:classappend="${#fields.hasErrors('teamAGoalsConceded')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAGoalsConceded')}" th:errors="*{teamAGoalsConceded}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAGoalsConcededPerMatch">Goals Conceded / Match</label><input id="teamAGoalsConcededPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{teamAGoalsConcededPerMatch}" th:classappend="${#fields.hasErrors('teamAGoalsConcededPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAGoalsConcededPerMatch')}" th:errors="*{teamAGoalsConcededPerMatch}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamACleanSheets">Clean Sheets</label><input id="teamACleanSheets" type="number" min="0" class="form-control" th:field="*{teamACleanSheets}" th:classappend="${#fields.hasErrors('teamACleanSheets')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamACleanSheets')}" th:errors="*{teamACleanSheets}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamACleanSheetRate">Clean Sheet Rate %</label><input id="teamACleanSheetRate" type="number" min="0" max="100" class="form-control" th:field="*{teamACleanSheetRate}" th:classappend="${#fields.hasErrors('teamACleanSheetRate')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamACleanSheetRate')}" th:errors="*{teamACleanSheetRate}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAConcedingRate">Conceding Rate %</label><input id="teamAConcedingRate" type="number" min="0" max="100" class="form-control" th:field="*{teamAConcedingRate}" th:classappend="${#fields.hasErrors('teamAConcedingRate')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAConcedingRate')}" th:errors="*{teamAConcedingRate}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAXgaPerMatch">xGA / Match</label><input id="teamAXgaPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{teamAXgaPerMatch}" th:classappend="${#fields.hasErrors('teamAXgaPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAXgaPerMatch')}" th:errors="*{teamAXgaPerMatch}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAShotsConcededPerMatch">Shots Conceded / Match</label><input id="teamAShotsConcededPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{teamAShotsConcededPerMatch}" th:classappend="${#fields.hasErrors('teamAShotsConcededPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAShotsConcededPerMatch')}" th:errors="*{teamAShotsConcededPerMatch}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamADefenceIndex">Defence Index</label><input id="teamADefenceIndex" type="number" min="0" max="100" class="form-control" th:field="*{teamADefenceIndex}" th:classappend="${#fields.hasErrors('teamADefenceIndex')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamADefenceIndex')}" th:errors="*{teamADefenceIndex}"></div></div>
                        </div>

                        <div class="row mt-2">
                            <div class="col-12"><h2 class="h6 fw-bold mb-3">Team B</h2></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBGoalsConceded">Goals Conceded</label><input id="teamBGoalsConceded" type="number" min="0" class="form-control" th:field="*{teamBGoalsConceded}" th:classappend="${#fields.hasErrors('teamBGoalsConceded')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBGoalsConceded')}" th:errors="*{teamBGoalsConceded}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBGoalsConcededPerMatch">Goals Conceded / Match</label><input id="teamBGoalsConcededPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{teamBGoalsConcededPerMatch}" th:classappend="${#fields.hasErrors('teamBGoalsConcededPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBGoalsConcededPerMatch')}" th:errors="*{teamBGoalsConcededPerMatch}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBCleanSheets">Clean Sheets</label><input id="teamBCleanSheets" type="number" min="0" class="form-control" th:field="*{teamBCleanSheets}" th:classappend="${#fields.hasErrors('teamBCleanSheets')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBCleanSheets')}" th:errors="*{teamBCleanSheets}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBCleanSheetRate">Clean Sheet Rate %</label><input id="teamBCleanSheetRate" type="number" min="0" max="100" class="form-control" th:field="*{teamBCleanSheetRate}" th:classappend="${#fields.hasErrors('teamBCleanSheetRate')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBCleanSheetRate')}" th:errors="*{teamBCleanSheetRate}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBConcedingRate">Conceding Rate %</label><input id="teamBConcedingRate" type="number" min="0" max="100" class="form-control" th:field="*{teamBConcedingRate}" th:classappend="${#fields.hasErrors('teamBConcedingRate')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBConcedingRate')}" th:errors="*{teamBConcedingRate}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBXgaPerMatch">xGA / Match</label><input id="teamBXgaPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{teamBXgaPerMatch}" th:classappend="${#fields.hasErrors('teamBXgaPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBXgaPerMatch')}" th:errors="*{teamBXgaPerMatch}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBShotsConcededPerMatch">Shots Conceded / Match</label><input id="teamBShotsConcededPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{teamBShotsConcededPerMatch}" th:classappend="${#fields.hasErrors('teamBShotsConcededPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBShotsConcededPerMatch')}" th:errors="*{teamBShotsConcededPerMatch}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBDefenceIndex">Defence Index</label><input id="teamBDefenceIndex" type="number" min="0" max="100" class="form-control" th:field="*{teamBDefenceIndex}" th:classappend="${#fields.hasErrors('teamBDefenceIndex')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBDefenceIndex')}" th:errors="*{teamBDefenceIndex}"></div></div>
                        </div>

                        <div class="mb-3 mt-2">
                            <label class="form-label" for="analysis">Defense Insight</label>
                            <textarea id="analysis" rows="6" class="form-control" th:field="*{analysis}" th:classappend="${#fields.hasErrors('analysis')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('analysis')}" th:errors="*{analysis}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${defenseAnalysis.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/defense-analyses}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
