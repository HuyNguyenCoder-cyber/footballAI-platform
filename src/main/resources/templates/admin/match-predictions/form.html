<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${prediction.id == null ? 'Create Prediction' : 'Update Prediction'}">Prediction Form</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${prediction.id == null ? 'Create Prediction' : 'Update Prediction'}"></h1>
                        <p class="text-muted mb-0">Manage AI score prediction and confidence.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${prediction.id == null} ? @{/admin/match-predictions/create} : @{/admin/match-predictions/{id}/update(id=${prediction.id})}"
                          th:object="${prediction}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${prediction.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB + ' | ' + #temporals.format(match.matchTime, 'dd MMM yyyy HH:mm')}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${prediction.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${prediction.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="scorePrediction">Score Prediction</label>
                            <input id="scorePrediction" type="text" class="form-control" th:field="*{scorePrediction}" th:classappend="${#fields.hasErrors('scorePrediction')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('scorePrediction')}" th:errors="*{scorePrediction}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="confidence">Confidence</label>
                            <input id="confidence" type="number" class="form-control" th:field="*{confidence}" min="0" max="100" th:classappend="${#fields.hasErrors('confidence')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confidence')}" th:errors="*{confidence}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${prediction.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/match-predictions}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
