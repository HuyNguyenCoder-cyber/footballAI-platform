<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${squadAnalysis.id == null ? 'Create Squad Analysis' : 'Update Squad Analysis'}">Squad Analysis Form</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${squadAnalysis.id == null ? 'Create Squad Analysis' : 'Update Squad Analysis'}"></h1>
                        <p class="text-muted mb-0">Manage squad and lineup content for both teams.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${squadAnalysis.id == null} ? @{/admin/squad-analyses/create} : @{/admin/squad-analyses/{id}/update(id=${squadAnalysis.id})}"
                          th:object="${squadAnalysis}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${squadAnalysis.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${squadAnalysis.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${squadAnalysis.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="teamAContent">Team A Content</label>
                            <textarea id="teamAContent" rows="8" class="form-control" th:field="*{teamAContent}" th:classappend="${#fields.hasErrors('teamAContent')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAContent')}" th:errors="*{teamAContent}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="teamBContent">Team B Content</label>
                            <textarea id="teamBContent" rows="8" class="form-control" th:field="*{teamBContent}" th:classappend="${#fields.hasErrors('teamBContent')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBContent')}" th:errors="*{teamBContent}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${squadAnalysis.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/squad-analyses}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
