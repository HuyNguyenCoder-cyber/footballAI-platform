<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Analyses</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Squad Analyses</h1>
            <p class="text-muted mb-0">Manage squad and lineup information for each match.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/squad-analyses/new}">New Squad Analysis</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Match</th>
                        <th>Status</th>
                        <th style="width: 220px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${squadAnalyses}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.matchLabel}"></td>
                        <td th:text="${item.matchStatus}"></td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary me-2" th:href="@{/admin/squad-analyses/{id}/edit(id=${item.id})}">Edit</a>
                            <form th:action="@{/admin/squad-analyses/{id}/delete(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this squad analysis?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(squadAnalyses)}">
                        <td colspan="4" class="text-center text-muted py-4">No squad analyses found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
