<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${teamRecentForm.id == null ? 'Create Team Recent Form' : 'Update Team Recent Form'}">Team Recent Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${teamRecentForm.id == null ? 'Create Team Recent Form' : 'Update Team Recent Form'}"></h1>
                        <p class="text-muted mb-0">Manage team recent form statistics for match analysis.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${teamRecentForm.id == null} ? @{/admin/team-recent-forms/create} : @{/admin/team-recent-forms/{id}/update(id=${teamRecentForm.id})}"
                          th:object="${teamRecentForm}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${teamRecentForm.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${teamRecentForm.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${teamRecentForm.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="teamSide">Team Side</label>
                            <select id="teamSide" class="form-select" th:field="*{teamSide}" th:classappend="${#fields.hasErrors('teamSide')} ? 'is-invalid' : ''">
                                <option value="">-- Select team side --</option>
                                <option th:each="teamSide : ${teamSides}" th:value="${teamSide}" th:text="${teamSide}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamSide')}" th:errors="*{teamSide}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="recentMatchesText">Recent Matches</label>
                            <textarea id="recentMatchesText" rows="4" class="form-control" th:field="*{recentMatchesText}" th:classappend="${#fields.hasErrors('recentMatchesText')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('recentMatchesText')}" th:errors="*{recentMatchesText}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="wins">Wins</label>
                                <input id="wins" type="number" min="0" class="form-control" th:field="*{wins}" th:classappend="${#fields.hasErrors('wins')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('wins')}" th:errors="*{wins}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="draws">Draws</label>
                                <input id="draws" type="number" min="0" class="form-control" th:field="*{draws}" th:classappend="${#fields.hasErrors('draws')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('draws')}" th:errors="*{draws}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="losses">Losses</label>
                                <input id="losses" type="number" min="0" class="form-control" th:field="*{losses}" th:classappend="${#fields.hasErrors('losses')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('losses')}" th:errors="*{losses}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="goalsScored">Goals Scored</label>
                                <input id="goalsScored" type="number" min="0" class="form-control" th:field="*{goalsScored}" th:classappend="${#fields.hasErrors('goalsScored')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('goalsScored')}" th:errors="*{goalsScored}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="goalsConceded">Goals Conceded</label>
                                <input id="goalsConceded" type="number" min="0" class="form-control" th:field="*{goalsConceded}" th:classappend="${#fields.hasErrors('goalsConceded')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('goalsConceded')}" th:errors="*{goalsConceded}"></div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="cleanSheets">Clean Sheets</label>
                                <input id="cleanSheets" type="number" min="0" class="form-control" th:field="*{cleanSheets}" th:classappend="${#fields.hasErrors('cleanSheets')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cleanSheets')}" th:errors="*{cleanSheets}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="winRate">Win Rate %</label>
                                <input id="winRate" type="number" min="0" max="100" class="form-control" th:field="*{winRate}" th:classappend="${#fields.hasErrors('winRate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('winRate')}" th:errors="*{winRate}"></div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="cleanSheetRate">Clean Sheet Rate %</label>
                                <input id="cleanSheetRate" type="number" min="0" max="100" class="form-control" th:field="*{cleanSheetRate}" th:classappend="${#fields.hasErrors('cleanSheetRate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cleanSheetRate')}" th:errors="*{cleanSheetRate}"></div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="scoringRate">Scoring Rate %</label>
                                <input id="scoringRate" type="number" min="0" max="100" class="form-control" th:field="*{scoringRate}" th:classappend="${#fields.hasErrors('scoringRate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('scoringRate')}" th:errors="*{scoringRate}"></div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label" for="concedingRate">Conceding Rate %</label>
                                <input id="concedingRate" type="number" min="0" max="100" class="form-control" th:field="*{concedingRate}" th:classappend="${#fields.hasErrors('concedingRate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('concedingRate')}" th:errors="*{concedingRate}"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${teamRecentForm.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/team-recent-forms}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
