<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${headToHead.id == null ? 'Create Head To Head' : 'Update Head To Head'}">Head To Head Form</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${headToHead.id == null ? 'Create Head To Head' : 'Update Head To Head'}"></h1>
                        <p class="text-muted mb-0">Manage historical head to head data for match analysis.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${headToHead.id == null} ? @{/admin/head-to-heads/create} : @{/admin/head-to-heads/{id}/update(id=${headToHead.id})}"
                          th:object="${headToHead}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${headToHead.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${headToHead.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${headToHead.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="h2hMatchesText">Recent H2H Matches</label>
                            <textarea id="h2hMatchesText" rows="5" class="form-control" th:field="*{h2hMatchesText}" th:classappend="${#fields.hasErrors('h2hMatchesText')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('h2hMatchesText')}" th:errors="*{h2hMatchesText}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label" for="totalMatches">Total Matches</label><input id="totalMatches" type="number" min="0" class="form-control" th:field="*{totalMatches}" th:classappend="${#fields.hasErrors('totalMatches')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('totalMatches')}" th:errors="*{totalMatches}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAWins">Team A Wins</label><input id="teamAWins" type="number" min="0" class="form-control" th:field="*{teamAWins}" th:classappend="${#fields.hasErrors('teamAWins')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAWins')}" th:errors="*{teamAWins}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="draws">Draws</label><input id="draws" type="number" min="0" class="form-control" th:field="*{draws}" th:classappend="${#fields.hasErrors('draws')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('draws')}" th:errors="*{draws}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBWins">Team B Wins</label><input id="teamBWins" type="number" min="0" class="form-control" th:field="*{teamBWins}" th:classappend="${#fields.hasErrors('teamBWins')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBWins')}" th:errors="*{teamBWins}"></div></div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamAGoals">Team A Goals</label><input id="teamAGoals" type="number" min="0" class="form-control" th:field="*{teamAGoals}" th:classappend="${#fields.hasErrors('teamAGoals')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamAGoals')}" th:errors="*{teamAGoals}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="teamBGoals">Team B Goals</label><input id="teamBGoals" type="number" min="0" class="form-control" th:field="*{teamBGoals}" th:classappend="${#fields.hasErrors('teamBGoals')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBGoals')}" th:errors="*{teamBGoals}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="totalGoals">Total Goals</label><input id="totalGoals" type="number" min="0" class="form-control" th:field="*{totalGoals}" th:classappend="${#fields.hasErrors('totalGoals')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('totalGoals')}" th:errors="*{totalGoals}"></div></div>
                            <div class="col-md-3 mb-3"><label class="form-label" for="averageGoalsPerMatch">Average Goals / Match</label><input id="averageGoalsPerMatch" type="number" min="0" step="0.01" class="form-control" th:field="*{averageGoalsPerMatch}" th:classappend="${#fields.hasErrors('averageGoalsPerMatch')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('averageGoalsPerMatch')}" th:errors="*{averageGoalsPerMatch}"></div></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label" for="teamACleanSheets">Team A Clean Sheets</label><input id="teamACleanSheets" type="number" min="0" class="form-control" th:field="*{teamACleanSheets}" th:classappend="${#fields.hasErrors('teamACleanSheets')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamACleanSheets')}" th:errors="*{teamACleanSheets}"></div></div>
                            <div class="col-md-6 mb-3"><label class="form-label" for="teamBCleanSheets">Team B Clean Sheets</label><input id="teamBCleanSheets" type="number" min="0" class="form-control" th:field="*{teamBCleanSheets}" th:classappend="${#fields.hasErrors('teamBCleanSheets')} ? 'is-invalid' : ''"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamBCleanSheets')}" th:errors="*{teamBCleanSheets}"></div></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="analysis">Head To Head Analysis</label>
                            <textarea id="analysis" rows="6" class="form-control" th:field="*{analysis}" th:classappend="${#fields.hasErrors('analysis')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('analysis')}" th:errors="*{analysis}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${headToHead.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/head-to-heads}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
