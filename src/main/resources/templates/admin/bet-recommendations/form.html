<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${recommendation.id == null ? 'Create Recommendation' : 'Update Recommendation'}">Recommendation Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('dashboard')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${recommendation.id == null ? 'Create Recommendation' : 'Update Recommendation'}"></h1>
                        <p class="text-muted mb-0">Manage recommendation details.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${recommendation.id == null} ? @{/admin/bet-recommendations/create} : @{/admin/bet-recommendations/{id}/update(id=${recommendation.id})}"
                          th:object="${recommendation}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3" th:if="${recommendation.id == null}">
                            <label class="form-label" for="matchId">Match</label>
                            <select id="matchId" class="form-select" th:field="*{matchId}" th:classappend="${#fields.hasErrors('matchId')} ? 'is-invalid' : ''">
                                <option value="">-- Select match --</option>
                                <option th:each="match : ${matches}" th:value="${match.id}" th:text="${match.teamA + ' vs ' + match.teamB + ' | ' + #temporals.format(match.matchTime, 'dd MMM yyyy HH:mm')}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchId')}" th:errors="*{matchId}"></div>
                        </div>

                        <div class="mb-3" th:if="${recommendation.id != null}">
                            <label class="form-label" for="matchLabel">Match</label>
                            <input id="matchLabel" type="text" class="form-control" th:value="${recommendation.matchLabel}" readonly>
                            <input type="hidden" th:field="*{matchId}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="betType">Bet Type</label>
                            <select id="betType" class="form-select" th:field="*{betType}" th:classappend="${#fields.hasErrors('betType')} ? 'is-invalid' : ''">
                                <option value="">-- Select bet type --</option>
                                <option th:each="type : ${betTypes}" th:value="${type}" th:text="${type}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('betType')}" th:errors="*{betType}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="title">Title</label>
                            <input id="title" type="text" class="form-control" th:field="*{title}" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="recommendation">Recommendation</label>
                            <textarea id="recommendation" class="form-control" rows="3" th:field="*{recommendation}" th:classappend="${#fields.hasErrors('recommendation')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('recommendation')}" th:errors="*{recommendation}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="displayOrder">Display Order</label>
                            <input id="displayOrder" type="number" class="form-control" th:field="*{displayOrder}" min="0" th:classappend="${#fields.hasErrors('displayOrder')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" th:text="${recommendation.id == null ? 'Create' : 'Update'}">Create</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/bet-recommendations}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
