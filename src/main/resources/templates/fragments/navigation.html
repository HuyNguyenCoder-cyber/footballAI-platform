<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="dashboardNav(activePage)" class="bg-white border-bottom sticky-top">
    <div class="container-fluid px-4 py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
        <a class="text-decoration-none d-flex align-items-center gap-2 text-dark fw-bold" th:href="@{/admin/dashboard}">
            <span class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                  style="width: 36px; height: 36px;">AI</span>
            <span>Admin Dashboard</span>
        </a>

        <nav class="d-flex flex-wrap gap-2">
            <a class="btn btn-sm"
               th:classappend="${activePage == 'dashboard'} ? 'btn-primary' : 'btn-outline-secondary'"
               th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="btn btn-sm"
               th:classappend="${activePage == 'matches'} ? 'btn-primary' : 'btn-outline-secondary'"
               th:href="@{/admin/matches}">Matches</a>
            <a class="btn btn-sm"
               th:classappend="${activePage == 'competitions'} ? 'btn-primary' : 'btn-outline-secondary'"
               th:href="@{/admin/competitions}">Competitions</a>
            <a class="btn btn-sm"
               th:classappend="${activePage == 'users'} ? 'btn-primary' : 'btn-outline-secondary'"
               th:href="@{/admin/users}">Users</a>
        </nav>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
