<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${seo.title}">Bukayo Saka - Cầu thủ chủ chốt | Football AI</title>
    <meta name="description" th:content="${seo.description}">
    <link rel="canonical" th:href="${seo.canonicalUrl}">
    <meta property="og:title" th:content="${seo.ogTitle}">
    <meta property="og:description" th:content="${seo.ogDescription}">
    <meta property="og:type" th:content="${seo.ogType}">
    <meta property="og:url" th:content="${seo.ogUrl}">
    <meta property="og:image" th:content="${seo.ogImage}">
    <meta name="twitter:card" th:content="${seo.twitterCard}">
    <meta name="twitter:title" th:content="${seo.twitterTitle}">
    <meta name="twitter:description" th:content="${seo.twitterDescription}">
    <meta name="robots" content="index,follow">
    <link rel="icon" th:href="@{/assets/images/og-default.svg}">
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <script type="application/ld+json" th:utext="${seo.structuredDataJson}">
        {}
    </script>
    <style>
        :root {
            --page-bg: #f4f7fb;
            --card-border: #e6ebf2;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(13, 110, 253, 0.08), transparent 32%),
                var(--page-bg);
            color: #111827;
        }

        .page-shell {
            max-width: 1080px;
        }

        .detail-card {
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .player-avatar-large {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-inline: auto;
            background: #eef2ff;
            border: 1px solid #dbe4ff;
            color: #0f172a;
            font-weight: 800;
            font-size: 3rem;
            overflow: hidden;
        }

        .player-avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-label {
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6b7280;
        }
    </style>
</head>
<body>
<main class="page-shell container py-4 py-md-5">
    <div class="mb-4">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/matches/{id}/analysis(id=${keyPlayer.matchId})}">Back to Match Analysis</a>
    </div>

    <section class="detail-card p-4 p-md-5">
        <div class="row g-4 align-items-start">
            <div class="col-12 col-lg-7">
                <div class="info-label mb-2">Player Profile</div>
                <h1 class="h3 fw-bold mb-4" th:text="${keyPlayer.playerName}">Bukayo Saka</h1>

                <div class="mb-3">
                    <div class="info-label mb-1">Player Name</div>
                    <div class="fs-5 fw-semibold" th:text="${keyPlayer.playerName}">Bukayo Saka</div>
                </div>

                <div class="mb-3">
                    <div class="info-label mb-1">Team Name</div>
                    <div class="fs-6" th:text="${keyPlayer.teamName}">Arsenal</div>
                </div>

                <div class="mb-3">
                    <div class="info-label mb-1">Match</div>
                    <div class="fs-6" th:text="${match.teamA + ' vs ' + match.teamB}">Arsenal vs PSG</div>
                </div>

                <div>
                    <div class="info-label mb-1">Description</div>
                    <div class="fs-6" th:text="${keyPlayer.shortDescription}">Attacking threat, excellent ball progression...</div>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="info-label text-center mb-3">Player Image</div>
                <div class="player-avatar-large">
                    <img th:if="${!#strings.isEmpty(keyPlayer.imageUrl)}"
                         th:src="${keyPlayer.imageUrl}"
                         alt="Player image">
                    <span th:if="${#strings.isEmpty(keyPlayer.imageUrl)}" th:text="${keyPlayer.avatarInitials}">BU</span>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
