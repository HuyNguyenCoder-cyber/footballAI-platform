<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('competitions')}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Competition Management</h1>
            <p class="text-muted mb-0">List, create, update, and delete competitions.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/competitions/new}">New Competition</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 100px;">ID</th>
                        <th>Name</th>
                        <th style="width: 220px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="competition : ${competitions}">
                        <td th:text="${competition.id}"></td>
                        <td th:text="${competition.name}"></td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary me-2"
                               th:href="@{/competitions/{id}/edit(id=${competition.id})}">Edit</a>
                            <form th:action="@{/competitions/{id}/delete(id=${competition.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Delete this competition?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(competitions)}">
                        <td colspan="3" class="text-center text-muted py-4">No competitions found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
