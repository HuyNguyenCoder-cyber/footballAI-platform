<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Yêu cầu không hợp lệ</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="text-uppercase text-secondary small fw-semibold mb-2">400 Error</div>
                    <h1 class="display-6 fw-bold mb-3" th:text="${errorTitle ?: 'Yêu cầu không hợp lệ'}">Yêu cầu không hợp lệ</h1>
                    <p class="text-secondary mb-4" th:text="${errorMessage ?: 'Yêu cầu bạn gửi lên chưa đúng định dạng hoặc thiếu dữ liệu cần thiết.'}">
                        Yêu cầu bạn gửi lên chưa đúng định dạng hoặc thiếu dữ liệu cần thiết.
                    </p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a class="btn btn-primary px-4" th:href="@{/home}">Quay về Trang chủ</a>
                        <a class="btn btn-outline-secondary px-4" href="javascript:history.back()">Quay lại</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
