<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="mb-3">
                <a class="btn btn-outline-secondary btn-sm px-3" th:href="@{/}">
                    &larr; Back to Home
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-bold mb-3"
                             style="width: 56px; height: 56px;">AI</div>
                        <h1 class="h4 mb-1">Đăng Nhập</h1>
                        <p class="text-muted mb-0">Chức năng chưa triển khai, vui lòng không cố đăng nhập</p>
                    </div>

                    <div class="alert alert-danger" th:if="${param.error}">
                        Sai tên đăng nhập hoặc mật khẩu.
                    </div>
                    <div class="alert alert-warning" th:if="${param.locked}">
                        Tài Khoản này đã bị khóa do spam quá nhiều.
                    </div>
                    <div class="alert alert-warning" th:if="${param.rateLimit}">
                        Bạn đang gửi quá nhiều đăng nhập, thử lại sau.
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">
                        Bạn đã đăng xuất
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" name="username" type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
