<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Match Management</h1>
            <p class="text-muted mb-0">List, create, update, and delete matches.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/matches/new}">New Match</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Competition</th>
                        <th>Team A</th>
                        <th>Logo A</th>
                        <th>Team B</th>
                        <th>Logo B</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th style="width: 220px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="match : ${matches}">
                        <td th:text="${match.id}"></td>
                        <td th:text="${match.competitionId}"></td>
                        <td th:text="${match.teamA}"></td>
                        <td>
                            <img th:if="${match.teamALogo}"
                                 th:src="${match.teamALogo}"
                                 alt="Team A logo"
                                 class="img-thumbnail"
                                 style="max-height: 48px;">
                            <span th:if="${match.teamALogo == null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${match.teamB}"></td>
                        <td>
                            <img th:if="${match.teamBLogo}"
                                 th:src="${match.teamBLogo}"
                                 alt="Team B logo"
                                 class="img-thumbnail"
                                 style="max-height: 48px;">
                            <span th:if="${match.teamBLogo == null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${#temporals.format(match.matchTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${match.status}"></td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary me-2"
                               th:href="@{/matches/{id}/edit(id=${match.id})}">Edit</a>
                            <form th:action="@{/matches/{id}/delete(id=${match.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Delete this match?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(matches)}">
                        <td colspan="9" class="text-center text-muted py-4">No matches found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
