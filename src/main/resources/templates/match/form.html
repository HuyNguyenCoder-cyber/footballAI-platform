<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${match.id == null ? 'Create Match' : 'Update Match'}">Match Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navigation :: dashboardNav('matches')}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h1 class="h4 mb-1" th:text="${match.id == null ? 'Create Match' : 'Update Match'}"></h1>
                        <p class="text-muted mb-0">Use this form to manage a match record.</p>
                    </div>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${match.id == null} ? @{/admin/matches/create} : @{/admin/matches/{id}/update(id=${match.id})}"
                          th:object="${match}"
                          method="post"
                          enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="teamA">Team A</label>
                                <input type="text"
                                       id="teamA"
                                       class="form-control"
                                       th:field="*{teamA}"
                                       th:classappend="${#fields.hasErrors('teamA')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamA')}" th:errors="*{teamA}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Team A Logo</label>
                                <div class="mb-2" th:if="*{teamALogo}">
                                    <img th:src="*{teamALogo}" alt="Team A logo" class="img-thumbnail" style="max-height: 80px;">
                                </div>
                                <input type="hidden" th:field="*{teamALogo}">
                                <input type="file" class="form-control" th:field="*{teamALogoFile}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="teamB">Team B</label>
                                <input type="text"
                                       id="teamB"
                                       class="form-control"
                                       th:field="*{teamB}"
                                       th:classappend="${#fields.hasErrors('teamB')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('teamB')}" th:errors="*{teamB}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Team B Logo</label>
                                <div class="mb-2" th:if="*{teamBLogo}">
                                    <img th:src="*{teamBLogo}" alt="Team B logo" class="img-thumbnail" style="max-height: 80px;">
                                </div>
                                <input type="hidden" th:field="*{teamBLogo}">
                                <input type="file" class="form-control" th:field="*{teamBLogoFile}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="matchTime">Match Time</label>
                                <input type="datetime-local"
                                       id="matchTime"
                                       class="form-control"
                                       th:field="*{matchTime}"
                                       th:classappend="${#fields.hasErrors('matchTime')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matchTime')}" th:errors="*{matchTime}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="status">Match Status</label>
                                <select id="status"
                                        class="form-select"
                                        th:field="*{status}"
                                        th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                                    <option value="">-- Select status --</option>
                                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="competitionId">Competition</label>
                            <select id="competitionId"
                                    class="form-select"
                                    th:field="*{competitionId}"
                                    th:classappend="${#fields.hasErrors('competitionId')} ? 'is-invalid' : ''">
                                <option value="">-- Select competition --</option>
                                <option th:each="competition : ${competitions}"
                                        th:value="${competition.id}"
                                        th:text="${competition.name}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('competitionId')}" th:errors="*{competitionId}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${match.id == null ? 'Create' : 'Update'}"></span>
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/matches}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
