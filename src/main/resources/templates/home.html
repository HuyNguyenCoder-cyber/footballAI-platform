<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Football Platform - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            color: #212529;
        }

        .page-shell {
            max-width: 1400px;
        }

        .match-card {
            border: 1px solid #dee2e6;
            border-radius: 16px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
            height: 100%;
        }

        .match-card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .team-logo {
            width: 48px;
            height: 48px;
            object-fit: cover;
        }

        .team-placeholder {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border-radius: 50%;
            background: #f1f3f5;
        }
    </style>
</head>
<body>

<header class="bg-white border-bottom sticky-top">
    <div class="page-shell container-fluid px-4 py-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
                 style="width: 40px; height: 40px;">AI</div>
            <span class="fs-4 fw-bold text-dark">AI Football <span class="text-primary">Platform</span></span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-primary btn-sm fw-semibold" th:href="@{/login}">Đăng nhập</a>
        </div>
    </div>
</header>

<section class="page-shell container-fluid px-4 py-4">
    <h1 class="h2 fw-bold text-dark mb-1">Lịch thi đấu & Phân tích dữ liệu AI</h1>
    <p class="text-secondary mb-0">Cập nhật múi giờ hệ thống: GMT+7</p>
</section>

<main class="page-shell container-fluid px-4 pb-5">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-4 align-items-start">
                <div class="col-12 col-lg-7">
                    <div class="fw-semibold mb-2">Giải đấu</div>
                    <div class="d-flex gap-2 flex-wrap">
                        <a class="btn btn-sm rounded-pill px-3 fw-medium text-nowrap"
                           th:classappend="${selectedCompetitionId == null} ? 'btn-primary' : 'btn-outline-secondary'"
                           th:href="${selectedStatus != null} ? @{/(status=${selectedStatus})} : @{/}">Tất cả giải đấu</a>
                        <th:block th:each="competition : ${competitions}">
                            <a class="btn btn-sm rounded-pill px-3 fw-medium text-nowrap"
                               th:classappend="${selectedCompetitionId != null and selectedCompetitionId == competition.id} ? 'btn-primary' : 'btn-outline-secondary'"
                               th:href="${selectedStatus != null} ? @{/(competitionId=${competition.id}, status=${selectedStatus})} : @{/(competitionId=${competition.id})}"
                               th:text="${competition.name}">Competition</a>
                        </th:block>
                    </div>
                </div>

                <div class="col-12 col-lg-5">
                    <div class="fw-semibold mb-2">Status</div>
                    <div class="d-flex gap-2 flex-wrap">
                        <a class="btn btn-sm rounded-pill px-3 fw-medium text-nowrap"
                           th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline-secondary'"
                           th:href="${selectedCompetitionId != null} ? @{/(competitionId=${selectedCompetitionId})} : @{/}">Tất cả status</a>
                        <th:block th:each="item : ${statuses}">
                            <a class="btn btn-sm rounded-pill px-3 fw-medium text-nowrap"
                               th:classappend="${selectedStatus != null and selectedStatus == item} ? 'btn-primary' : 'btn-outline-secondary'"
                               th:href="${selectedCompetitionId != null} ? @{/(competitionId=${selectedCompetitionId}, status=${item})} : @{/(status=${item})}"
                               th:text="${item}">UPCOMING</a>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" th:each="match : ${matches}">
            <div class="card match-card">
                <div class="card-body p-4 d-flex flex-column justify-content-between h-100">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-4 small fw-semibold text-uppercase text-secondary">
                            <span th:text="${match.competitionName}">Competition</span>
                            <span class="badge text-primary bg-primary-subtle"
                                  th:text="${#temporals.format(match.matchTime, 'HH:mm - dd/MM')}">00:00 - 01/01</span>
                        </div>

                        <div class="row align-items-center text-center py-3">
                            <div class="col-5">
                                <div class="team-placeholder mx-auto mb-2 overflow-hidden">
                                    <img th:if="${match.teamALogo}"
                                         th:src="${match.teamALogo}"
                                         alt="Team A logo"
                                         class="team-logo">
                                    <span th:if="${match.teamALogo == null}"
                                          class="text-danger"
                                          th:text="${#strings.length(match.teamA) > 3 ? #strings.substring(match.teamA, 0, 3) : match.teamA}">ARS</span>
                                </div>
                                <div class="fw-bold text-dark text-truncate" th:text="${match.teamA}">Team A</div>
                            </div>

                            <div class="col-2">
                                <span class="badge text-secondary bg-light border rounded-pill px-3 py-2">VS</span>
                            </div>

                            <div class="col-5">
                                <div class="team-placeholder mx-auto mb-2 overflow-hidden">
                                    <img th:if="${match.teamBLogo}"
                                         th:src="${match.teamBLogo}"
                                         alt="Team B logo"
                                         class="team-logo">
                                    <span th:if="${match.teamBLogo == null}"
                                          class="text-primary"
                                          th:text="${#strings.length(match.teamB) > 3 ? #strings.substring(match.teamB, 0, 3) : match.teamB}">CHE</span>
                                </div>
                                <div class="fw-bold text-dark text-truncate" th:text="${match.teamB}">Team B</div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center small fw-semibold text-secondary mb-3" th:text="${match.status}">UPCOMING</div>

                    <div class="pt-3 border-top">
                        <a class="btn btn-light w-100 fw-bold btn-sm"
                           th:href="@{/matches/{id}/analysis(id=${match.id})}">
                            Xem Nhận Định AI
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(matches)}">
            <div class="card">
                <div class="card-body text-center text-secondary py-5">
                    Chưa có trận đấu nào.
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
